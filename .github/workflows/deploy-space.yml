name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the Space is configured, so forks do not fail.
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Spaces reads its config from README front matter, which the GitHub README must not carry.
          cp deploy/huggingface/README.md README.md
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan space
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
