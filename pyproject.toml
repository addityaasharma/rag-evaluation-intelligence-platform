[project]
name = "ragkit"
version = "0.1.0"
description = "A modular retrieval-augmented generation toolkit with a built-in evaluation harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "litellm>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "ragkit.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
